# ── Application ──────────────────────────────────────────────
spring.application.name=gym-management
server.port=8080

# ── Database H2 FILE-BASED (data lưu lại sau khi restart) ────
spring.datasource.url=jdbc:h2:file:./gymdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA — dùng update thay vì create-drop ────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── JWT ───────────────────────────────────────────────────────
jwt.secret=GymAppSuperSecretKeyForJWT2024AtLeast256BitsLong!
jwt.expiration=86400000

# ── App ───────────────────────────────────────────────────────
app.base-url=http://localhost:8080
# ── Membership cancellation ─────────────────────────────────────
# Số ngày cho phép user gửi yêu cầu hủy gói kể từ lúc thanh toán thành công
app.membership.cancel-window-days=7

# ── MoMo (sandbox test credentials - CHỈ dùng cho dev/test) ──────
# Đổi sang thông tin merchant thật khi lên production
momo.partner-code=MOMO
momo.access-key=F8BBA842ECF85
momo.secret-key=K951B6PE1waDMi640xX08PD3vg6EkVlz
momo.endpoint=https://test-payment.momo.vn/v2/gateway/api/create
# redirect-url: nơi MoMo redirect trình duyệt sau khi thanh toán (FE route)
momo.redirect-url=${app.base-url}/payment-result
# ipn-url: PHẢI là URL public MoMo gọi được (dùng ngrok khi chạy local, vd:
# https://xxxx.ngrok-free.app/api/momo/ipn)
momo.ipn-url=${app.base-url}/api/momo/ipn

# ── Scheduling ────────────────────────────────────────────────
spring.task.scheduling.enabled=true

# ── Logging ───────────────────────────────────────────────────
logging.level.com.example.gymmanagement=INFO
logging.level.org.springframework.security=WARN
