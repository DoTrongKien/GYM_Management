# ── Application ──────────────────────────────────────────────
spring.application.name=gym-management
server.port=8080

# ── Database H2 FILE-BASED (data lưu lại sau khi restart) ────
spring.datasource.url=jdbc:h2:file:./gymdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA — dùng update thay vì create-drop ────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── JWT ───────────────────────────────────────────────────────
jwt.secret=GymAppSuperSecretKeyForJWT2024AtLeast256BitsLong!
jwt.expiration=86400000

# ── App ───────────────────────────────────────────────────────
app.base-url=http://localhost:8080

# ── File upload (đính kèm chat) ───────────────────────────────
app.upload-dir=./uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ── Scheduling ────────────────────────────────────────────────
spring.task.scheduling.enabled=true

# ── Logging ───────────────────────────────────────────────────
logging.level.com.example.gymmanagement=INFO
logging.level.org.springframework.security=WARN
# ── Chuyển khoản ngân hàng (VietQR + SePay webhook) ──────────────
