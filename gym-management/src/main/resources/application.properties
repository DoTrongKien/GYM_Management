# ── Application ──────────────────────────────────────────────
spring.application.name=gym-management
server.port=8080

# ── Database (H2 in-memory for dev; swap to MySQL for prod) ──
spring.datasource.url=jdbc:h2:mem:GymManagement;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=1
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA ───────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ───────────────────────────────────────────────────────
jwt.secret=GymAppSuperSecretKeyForJWT2024AtLeast256BitsLong!
jwt.expiration=86400000

# ── App ───────────────────────────────────────────────────────
app.base-url=http://localhost:8080

# ── Scheduling ────────────────────────────────────────────────
spring.task.scheduling.enabled=true

# ── Logging ───────────────────────────────────────────────────
logging.level.com.example.gymmanagement=INFO
logging.level.org.springframework.security=WARN